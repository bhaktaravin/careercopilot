version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - corepack enable
        - corepack prepare pnpm@10 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Amplify Environment variables"
            exit 1
          fi
        - export PORT=25091 BASE_PATH=/
        - pnpm --filter @workspace/career-copilot run build
  artifacts:
    baseDirectory: artifacts/career-copilot/dist/public
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - artifacts/career-copilot/node_modules/**/*
  customRules:
    # SPA fallback only — do not rewrite .js/.css (blank page if you use "/<*>" alone)
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
      target: /index.html
      status: "200"
